<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A free CCNA 200-301 course from zero to expert, in English and Hinglish, with step-by-step network animations, videos and practice questions." />
    <title>Network Zero2Hero · CCNA from zero</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1c6e8c" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        // ?prefs={...} presets theme/language (used by scripts/shot.mjs for screenshots).
        var qp = new URLSearchParams(location.search).get("prefs");
        if (qp) localStorage.setItem("nz2h.prefs", qp);
        var p = JSON.parse(localStorage.getItem("nz2h.prefs") || "{}");
        var dark = p.theme === "dark" || (p.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
