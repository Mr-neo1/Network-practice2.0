# Builds the Android app on every push to main and publishes it as a GitHub release.
# Newest APK: https://github.com/Mr-neo1/Network-practice2.0/releases/latest/download/zero2hero-ccna.apk
name: Android app

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "supabase/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Above 1 so CI builds always update an APK built locally.
      VERSION_CODE: ${{ github.run_number }}0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew assembleRelease --no-daemon
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../zero2hero-ccna.apk
          else
            echo "::warning::No signing key in repository secrets, so the APK is unsigned and was not published. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
          fi
      - uses: softprops/action-gh-release@v2
        if: hashFiles('zero2hero-ccna.apk') != ''
        with:
          tag_name: android-1.0.${{ env.VERSION_CODE }}
          name: Android app 1.0.${{ env.VERSION_CODE }}
          make_latest: true
          files: zero2hero-ccna.apk
          body: |
            Download **zero2hero-ccna.apk** below and open it on your phone to install or update.
            Built from ${{ github.sha }}.
