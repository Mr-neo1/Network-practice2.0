# Free Supabase projects pause after 7 days without database activity, which breaks sign-in.
# This touches the database every 3 days so the project stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call keepalive()
        run: |
          set -a; . ./.env.production; set +a
          code=$(curl -s -o out.txt -w "%{http_code}" -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat out.txt)"
          test "$code" = 200
